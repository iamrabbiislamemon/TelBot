name: Run Telegram Bot

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Restart every 5 hours so a fresh job picks up before GitHub's 6h job limit hits.
    - cron: '0 */5 * * *'

concurrency:
  group: telbot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python bot.py
